<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>正在进入客服控制台</title>

<!-- ✅ 核心加速 -->
<link rel="preconnect" href="https://crm.zmkj.cn" crossorigin>
<link rel="dns-prefetch" href="https://crm.zmkj.cn">
<link rel="prefetch" href="https://crm.zmkj.cn/admin/chat" as="document">

<style>
:root{--bg:#0f172a;--accent:#38bdf8;}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(120% 120% at 50% 0%,#1e3a8a,var(--bg));
  display:grid;place-items:center;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#e2e8f0;
}
.wrap{text-align:center;width:min(420px,88vw)}
.ring{
  width:80px;height:80px;margin:auto;
  border:6px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{
  height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:20px;
}
.bar i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,#38bdf8,#818cf8);
  transition:width .15s linear;
}
.meta{
  display:flex;justify-content:space-between;
  font-size:12px;color:#64748b;margin-top:10px;
}
.url{margin-top:16px;font-size:12px;color:#475569}
.url b{color:#7dd3fc}
</style>
</head>

<body>
<div class="wrap">
  <div class="ring"></div>
  <h1>正在加速进入客服控制台</h1>
  <div class="bar"><i id="fill"></i></div>
  <div class="meta">
    <span>状态：<b id="status">加速中</b></span>
    <span>耗时：<b id="ms">0</b> ms</span>
  </div>
  <div class="url">→ <b>https://crm.zmkj.cn/admin/chat</b></div>
</div>

<script>
const TARGET = "https://crm.zmkj.cn/admin/chat";
const start = performance.now();
const fill = document.getElementById("fill");
const status = document.getElementById("status");
const ms = document.getElementById("ms");

// 假进度
let p = 0;
const fake = setInterval(() => {
  if(p < 85) {
    p += Math.random() * 2;
    fill.style.width = p + "%";
  }
}, 80);

// 实时耗时
const tick = () => {
  ms.textContent = Math.floor(performance.now() - start);
  requestAnimationFrame(tick);
};
tick();

// ✅ 提前建立连接
fetch(TARGET, { mode: "no-cors", cache: "reload" }).finally(() => {
  clearInterval(fake);
  fill.style.width = "100%";
  status.textContent = "加速完成";

  requestAnimationFrame(() => {
    document.body.style.opacity = "0";
    document.body.style.transition = "opacity .25s ease";

    setTimeout(() => {
      window.location.replace(TARGET);
    }, 260);
  });
});

// ✅ 兜底
setTimeout(() => {
  window.location.replace(TARGET);
}, 6000);
</script>
</body>
</html>
