<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>肆意网络 · 服务中心</title>
<style>
:root {
    --primary: #3b82f6;
    --secondary: #7c3aed;
    --accent: #06b6d4;
    --card-bg: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.18);
    --text: #ffffff;
    --text-sec: rgba(255,255,255,0.88);
    --text-sub: rgba(255,255,255,0.68);
}

/* ========== 重置 ========== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ========== 背景层 ========== */
#bg-layer {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-color: #0b1222;
    transition: background-image .6s ease, opacity .6s ease;
    opacity: 0;
}
#bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        linear-gradient(180deg, rgba(10,15,30,.32), rgba(10,15,30,.42)),
        radial-gradient(ellipse 50% 40% at 15% 20%, rgba(59,130,246,.05), transparent),
        radial-gradient(ellipse 45% 35% at 85% 80%, rgba(124,58,237,.05), transparent);
}

body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow-x:hidden;
}

/* ========== 容器 ========== */
.container { width:100%; max-width:420px; padding:20px; position:relative; z-index:1; }

/* ========== 卡片（✅ 轻模糊） ========== */
.card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
        0 20px 50px -15px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.12);
    animation: fadeIn .7s cubic-bezier(.22,1,.36,1);
}
@keyframes fadeIn {
    from { opacity:0; transform:translateY(24px); }
    to { opacity:1; transform:none; }
}

/* ========== Header ========== */
.header { padding:44px 30px 32px; text-align:center; position:relative; }

/* 右上角工具区 */
.header-tools {
    position:absolute;
    top:18px;
    right:18px;
    display:flex;
    align-items:center;
    gap:10px;
}

/* 时钟 */
.clock {
    font-size:12px;
    color: var(--text-sec);
    background:rgba(0,0,0,.25);
    padding:5px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    font-variant-numeric: tabular-nums;
}

/* 刷新壁纸按钮 */
.refresh-bg {
    width:32px;
    height:32px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color: var(--text-sec);
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    transition:.35s;
    user-select:none;
}
.refresh-bg:hover { color: var(--text); background:rgba(255,255,255,.08); }
.refresh-bg:active { transform:scale(.92); }
.refresh-bg.spin { animation: spin .6s ease; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

.logo {
    width:76px; height:76px; margin:0 auto;
    border-radius:22px; display:flex; align-items:center; justify-content:center;
    font-size:34px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    box-shadow:
        0 12px 30px -6px rgba(59,130,246,.5),
        inset 0 -2px 6px rgba(0,0,0,.25),
        inset 0 2px 4px rgba(255,255,255,.25);
}

/* ✅ 字体全部纯白 */
.title {
    margin-top:22px;
    font-size:28px;
    font-weight:700;
    color: var(--text);
}
.subtitle {
    margin-top:8px;
    font-size:14px;
    color: var(--text-sec);
}

.status {
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:20px;
    padding:6px 16px;
    border-radius:999px;
    background:rgba(6,182,212,.12);
    color: var(--accent);
    font-size:13px;
    font-weight:500;
}
.status-dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
    animation:pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
    0%,100% { opacity:.7; transform:scale(.95); }
    50% { opacity:1; transform:scale(1.25); }
}

/* ========== 公告 ========== */
.notice {
    margin:24px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    color: var(--text-sec);
    font-size:13.5px;
    line-height:1.8;
}

/* ========== 菜单 ========== */
.menu { padding:0 20px 32px; display:flex; flex-direction:column; gap:16px; }

.item {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px; border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    text-decoration:none;
    color: var(--text);
    transition:.35s cubic-bezier(.4,0,.2,1);
    position:relative; overflow:hidden;
}
.item::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.08),transparent);
    opacity:0; transition:opacity .35s;
}
.item:hover {
    transform:translateY(-3px);
    border-color:rgba(255,255,255,.24);
    box-shadow:0 12px 28px -8px rgba(0,0,0,.35);
}
.item:hover::before { opacity:1; }

.left { display:flex; align-items:center; gap:16px; z-index:1; }
.icon {
    width:52px; height:52px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    box-shadow:0 8px 20px -4px rgba(59,130,246,.4);
}
.name { font-size:16px; font-weight:600; color: var(--text); }
.desc { margin-top:4px; font-size:13px; color: var(--text-sub); }
.arrow { font-size:22px; opacity:.6; transition:.35s; z-index:1; color: var(--text); }
.item:hover .arrow { opacity:1; transform:translateX(4px); }

/* ========== Footer ========== */
.footer {
    padding:18px; text-align:center; font-size:12px;
    color: var(--text-sub);
    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.12);
}

/* ========== 跳转页 ========== */
.loading-container { padding:48px 30px; text-align:center; }
.timer {
    font-size:64px; font-weight:800;
    font-variant-numeric: tabular-nums;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.progress-bar {
    height:8px; background:rgba(255,255,255,.08); border-radius:999px;
    margin:32px 0 20px; overflow:hidden;
}
.progress-fill {
    height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
    position:relative;
}
.progress-fill::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:shimmer 1.6s infinite;
}
@keyframes shimmer { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }
.status-text { font-size:14px; color: var(--text-sec); }

.go-btn {
    margin-top:32px; width:100%; padding:18px; border:none; border-radius:18px;
    font-size:16px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    box-shadow:0 10px 28px -6px rgba(59,130,246,.45); cursor:pointer; transition:.35s;
}
.go-btn:hover { transform:translateY(-3px); box-shadow:0 14px 32px -6px rgba(59,130,246,.6); }

/* ========== 悬浮客服 ========== */
.float-kefu {
    position:fixed; right:18px; bottom:22px; height:46px; padding:0 20px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; color:#fff; letter-spacing:.4px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.4); z-index:999; cursor:pointer;
    animation:breath 3s ease-in-out infinite;
}
@keyframes breath {
    0%,100% { box-shadow:0 10px 30px -8px rgba(0,0,0,.4); }
    50% { box-shadow:0 10px 34px -6px rgba(59,130,246,.4); }
}
.float-kefu:active { transform:scale(.96); }
</style>
</head>

<body>

<div id="bg-layer"></div>
<div id="bg-overlay"></div>

<div class="container">
    <div class="card" id="app"></div>
</div>

<div class="float-kefu" id="floatKefu">售后客服</div>

<script>
const bg = document.getElementById("bg-layer");
const fallback = "https://picsum.photos/id/1015/1920/1080";

function setRandomBg() {
    const imgUrl = "https://www.dmoe.cc/random.php?t=" + Date.now();
    const img = new Image();
    img.src = imgUrl;
    img.onload = () => {
        bg.style.backgroundImage = `url("${imgUrl}")`;
        bg.style.opacity = "1";
    };
    img.onerror = () => {
        bg.style.backgroundImage = `url("${fallback}")`;
        bg.style.opacity = "1";
    };
}
setRandomBg();

const app = document.getElementById("app");
const targets = {
    kawang: {
        title: "PUBG 八级号 / 谷歌白号",
        desc: "818云寄售卡网",
        icon: "🛒",
        url: "https://new.818fka.com/shop/sy926"
    },
    login: {
        title: "PUBG 扫码登录",
        desc: "安全极速登录",
        icon: "🔐",
        url: "https://mg.mgnb.cc"
    },
    kefu: {
        title: "售后客服中心",
        desc: "    ",
        icon: "💬",
        url: "https://crm.zmkj.cn/g/sy0827"
    }
};

const target = new URLSearchParams(location.search).get("target");
target ? renderJump(target) : renderHome();

function renderHome() {
    app.innerHTML = `
        <div class="header">
            <div class="header-tools">
                <div class="clock" id="clock">00:00:00</div>
                <div class="refresh-bg" id="refreshBg" title="换一张壁纸">⟳</div>
            </div>
            <div class="logo">SY</div>
            <div class="title">肆意网络</div>
            <div class="subtitle">PUBGM 服务中心</div>
            <div class="status">
                <div class="status-dot"></div>
                服务正常运行
            </div>
        </div>
        <div class="notice">
            📢 系统公告<br>
            平均响应速度：28ms<br>
            所有节点运行正常<br>
            客服在线：每天12:30-13:30
        </div>
        <div class="menu">
            ${Object.keys(targets).filter(k=>k!=='kefu').map(key=>{
                const i=targets[key];
                return `<a class="item" href="?target=${key}">
                    <div class="left">
                        <div class="icon">${i.icon}</div>
                        <div>
                            <div class="name">${i.title}</div>
                            <div class="desc">${i.desc}</div>
                        </div>
                    </div>
                    <div class="arrow">›</div>
                </a>`;
            }).join('')}
        </div>
        <div class="footer">©2026 肆意网络 · Version 3.0</div>
    `;
    startClock();

    const refreshBtn = document.getElementById("refreshBg");
    refreshBtn.addEventListener("click", () => {
        refreshBtn.classList.add("spin");
        setRandomBg();
        setTimeout(() => refreshBtn.classList.remove("spin"), 600);
    });
}

function renderJump(key) {
    const item = targets[key];
    if (!item) return location.href = "?";

    app.innerHTML = `
        <div class="header">
            <div class="logo">${item.icon}</div>
            <div class="title">正在连接服务</div>
            <div class="subtitle">${item.title}</div>
        </div>
        <div class="loading-container">
            <div class="timer" id="timer">0</div>
            <div style="color:var(--text-sub);margin-top:8px;">毫秒响应</div>
            <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
            <div class="status-text" id="status">正在初始化...</div>
            <button class="go-btn" id="go">立即进入 →</button>
        </div>
        <div class="footer">Powered by 肆意网络</div>
    `;

    const timerEl = document.getElementById("timer");
    const barEl = document.getElementById("bar");
    const statusEl = document.getElementById("status");
    const start = performance.now();

    const tick = t => { timerEl.innerText = Math.floor(t - start); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);

    const task = new Promise(r => setTimeout(r, 800 + Math.random() * 700));
    task.then(() => {
        const d = Math.floor(performance.now() - start);
        timerEl.innerText = d;
        barEl.style.width = "100%";
        statusEl.innerHTML =
            d < 1000 ? "连接迅速，正在跳转..." :
            d < 2000 ? "连接成功，正在跳转..." :
            "连接已建立，正在跳转...";
        setTimeout(() => location.href = item.url, 500);
    });

    const pi = setInterval(() => {
        const p = Math.min((performance.now() - start) / 2500 * 100, 95);
        barEl.style.width = p + "%";
    }, 16);

    task.finally(() => clearInterval(pi));
    document.getElementById("go").onclick = () => location.href = item.url;
}

function startClock() {
    const el = document.getElementById("clock");
    const u = () => el.innerText = new Date().toLocaleTimeString("zh-CN", {hour12:false});
    u();
    setInterval(u, 1000);
}

document.addEventListener("DOMContentLoaded", () => {
    const kefu = document.getElementById("floatKefu");
    if (kefu) {
        kefu.addEventListener("click", () => {
            window.location.href = "?target=kefu";
        });
    }
});
</script>
</body>
</html>
